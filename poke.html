<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Berries API</title>
    <link rel="stylesheet" href="css/styles.css" type="text/css">
</head>
<body>

    <h1>Pokemon Berries API</h1>
    
    <ul id="berriesList"></ul>
    
    <script>

        let url = "https://pokeapi.co/api/v2/berry/";
        let berriesList = document.getElementById("berriesList");

        async function fetchBerries() {
            const response = await fetch(url + "");
            console.log(response);

            const data = await response.json();
            console.log(data);

            data.results.forEach((results) => {

                berriesList.innerHTML += `<li><p>${results.name}</p></li>`
                
            })

        }

        fetchBerries();

    </script>
</body>
</html>
